<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Écosystème en maintenance — Loksite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:      #07090E;
  --text:    #F5F7FA;
  --t2:      #98A2B8;
  --t3:      #5C677E;
  --pr:      #6D5DFC;
  --pr2:     #5849e0;
  --border:  rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.14);
  --font:    'Sora', system-ui, sans-serif;
  --mono:    'JetBrains Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}

/* Ambient background, same language as the main site's hero */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 55% 45% at 78% 12%,rgba(109,93,252,.20),transparent 60%),
    radial-gradient(ellipse 45% 40% at 10% 92%,rgba(79,140,255,.08),transparent 60%);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(109,93,252,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(109,93,252,.05) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black,transparent 78%);
  pointer-events:none;
}

.card{
  position:relative;z-index:1;
  max-width:420px;width:100%;
  text-align:center;
  background:linear-gradient(155deg,rgba(255,255,255,.05),rgba(255,255,255,.015) 60%);
  border:1px solid var(--border2);
  border-radius:24px;
  padding:44px 36px 36px;
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  animation:cardIn .7s cubic-bezier(.16,1,.3,1) both;
}

.logo{
  display:inline-flex;align-items:center;gap:10px;
  margin-bottom:36px;
}
.logo-mark{width:32px;height:32px;border-radius:9px;display:block}
.logo-name{font-weight:800;font-size:17px;letter-spacing:-.03em;color:var(--text)}

.icon-wrap{
  position:relative;
  width:76px;height:76px;
  margin:0 auto 28px;
  display:flex;align-items:center;justify-content:center;
}
.icon-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(109,93,252,.18);
}
.icon-ring::before{
  content:'';position:absolute;inset:-1.5px;border-radius:50%;
  border:1.5px solid transparent;
  border-top-color:var(--pr);
  border-right-color:var(--pr);
  animation:spin 1.4s linear infinite;
}
.icon-core{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(140deg,rgba(109,93,252,.28),rgba(109,93,252,.06));
  border:1px solid rgba(109,93,252,.3);
  display:flex;align-items:center;justify-content:center;
  color:var(--pr);
  animation:pulseGlow 2.4s ease-in-out infinite;
}

h1{font-size:21px;font-weight:800;margin-bottom:10px;letter-spacing:-.02em}
p{font-size:14.5px;color:var(--t2);line-height:1.65;margin-bottom:30px}

.progress-track{
  width:100%;height:4px;border-radius:99px;
  background:rgba(255,255,255,.07);
  overflow:hidden;margin-bottom:18px;
}
.progress-bar{
  width:40%;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--pr),#a78bfa);
  animation:slide 1.6s ease-in-out infinite;
}

.status-row{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  color:var(--t3);text-transform:uppercase;
  margin-bottom:6px;
}
.status-dot{
  width:6px;height:6px;border-radius:50%;background:var(--pr);
  animation:pulse 2s infinite;
  box-shadow:0 0 8px rgba(109,93,252,.7);
}
.refresh-note{font-size:11.5px;color:var(--t3)}
.refresh-note b{color:var(--t2);font-variant-numeric:tabular-nums}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(109,93,252,.25)}
  50%{box-shadow:0 0 0 10px rgba(109,93,252,0)}
}
@keyframes slide{
  0%{transform:translateX(-110%)}
  50%{transform:translateX(60%)}
  100%{transform:translateX(260%)}
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(14px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@media(prefers-reduced-motion:reduce){
  .icon-ring::before,.icon-core,.progress-bar,.status-dot,.card{animation:none}
}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg class="logo-mark" width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="22" fill="#6D5DFC"/>
        <rect x="18" y="18" width="16" height="56" rx="4" fill="rgba(210,205,255,0.92)"/>
        <rect x="18" y="58" width="46" height="16" rx="4" fill="rgba(210,205,255,0.92)"/>
        <rect x="48" y="18" width="34" height="34" rx="7" fill="rgba(210,205,255,0.75)"/>
        <path d="M65 26 L66.5 31.5 L72 33 L66.5 34.5 L65 40 L63.5 34.5 L58 33 L63.5 31.5 Z" fill="#6D5DFC" opacity="0.9"/>
      </svg>
      <div class="logo-name">Loksite</div>
    </div>

    <div class="icon-wrap">
      <div class="icon-ring"></div>
      <div class="icon-core">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M21 12a9 9 0 11-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </div>
    </div>

    <h1>Écosystème en cours de mise à jour</h1>
    <p>Cette page est temporairement indisponible pendant que nous publions une amélioration. Elle sera de nouveau en ligne dans quelques instants — pas besoin de rafraîchir.</p>

    <div class="progress-track"><div class="progress-bar"></div></div>

    <div class="status-row"><span class="status-dot"></span> Mise à jour en cours</div>
    <div class="refresh-note">Nouvelle vérification dans <b id="lk-countdown">15</b>s</div>
  </div>

  <script>
    (function(){
      var s = 15;
      var el = document.getElementById('lk-countdown');
      setInterval(function(){
        s -= 1;
        if (s <= 0){ location.reload(); return; }
        if (el) el.textContent = s;
      }, 1000);
    })();
  </script>
</body>
</html>
